name: Publish Balanced OKRs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site generator
        run: python -m pip install 'mkdocs==1.6.1'
      - name: Prepare Markdown source
        run: |
          mkdir -p site-content/book site-content/training
          cp book/*.md site-content/book/
          mv site-content/book/README.md site-content/book/index.md
          cp pamphlet/README.md site-content/pamphlet.md
          cp training/index.md training/*.html site-content/training/
          cat > site-content/index.md <<'EOF'
          # Balanced OKRs

          **Measure progress without losing sight of what matters.**

          Sales hit its acquisition target. Should the campaign expand before those customers renew? Balanced OKRs pairs measurable Key Results with Guardrails that tell teams when to review a decision.

          Start with the [short pamphlet](pamphlet.md), follow the worked example in the [book](book/index.md), or [copy the worksheet](book/worksheet.md) for your next team review. Sources are collected in the [bibliography](book/bibliography.md).

          Practice a decision in underwriting, software delivery, service, or sales with the [training exercises](training/index.md).

          The framework is a proposed adaptation, not an established certification or empirically validated standard.

          [Contribute or review the manuscript on GitHub](https://github.com/Godeke/balanced-okr).
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path("site-content/pamphlet.md")
          s=p.read_text().replace("../book/README.md", "book/index.md").replace("../book/", "book/").replace("../README.md", "index.md")
          p.write_text(s)
          for p in Path("site-content/book").glob("*.md"):
              s=p.read_text().replace("../pamphlet/README.md", "../pamphlet.md").replace("../README.md", "../index.md").replace("(README.md)", "(index.md)")
              p.write_text(s)
          PY
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
